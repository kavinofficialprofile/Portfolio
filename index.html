<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Request access to Kavin M's resume">

    <title>Request My Resume | Kavin M</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(37, 99, 235, 0.25),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(124, 58, 237, 0.20),
                    transparent 35%
                ),

                #020617;

            color: #ffffff;

            overflow-x: hidden;
        }


        /* =====================================================
           BACKGROUND EFFECT
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                rgba(59, 130, 246, 0.08);

            filter: blur(100px);

            top: -200px;
            left: -200px;

            pointer-events: none;
        }


        body::after {

            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                rgba(139, 92, 246, 0.08);

            filter: blur(100px);

            right: -200px;
            bottom: -200px;

            pointer-events: none;
        }


        /* =====================================================
           MAIN SECTION
        ===================================================== */

        .resume-request-section {

            min-height: 100vh;

            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            padding:
                60px 20px;

            position: relative;

            z-index: 1;
        }


        /* =====================================================
           CARD
        ===================================================== */

        .resume-card {

            width: 100%;

            max-width: 620px;

            padding: 45px;

            border-radius: 30px;

            background:
                rgba(255, 255, 255, 0.07);

            border:
                1px solid
                rgba(255, 255, 255, 0.14);

            box-shadow:
                0 25px 80px
                rgba(0, 0, 0, 0.50);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            animation:
                cardFloat 5s
                ease-in-out
                infinite;
        }


        @keyframes cardFloat {

            0%,
            100% {

                transform:
                    translateY(0);
            }

            50% {

                transform:
                    translateY(-8px);
            }
        }


        /* =====================================================
           ICON
        ===================================================== */

        .resume-icon {

            width: 75px;

            height: 75px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.08);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            font-size: 34px;

            margin-bottom: 24px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.25);
        }


        /* =====================================================
           LABEL
        ===================================================== */

        .resume-label {

            display: inline-block;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 3px;

            color:
                rgba(255, 255, 255, 0.65);

            margin-bottom: 8px;
        }


        /* =====================================================
           HEADING
        ===================================================== */

        .resume-card h1 {

            font-size:
                clamp(
                    34px,
                    6vw,
                    52px
                );

            line-height: 1.1;

            margin:
                10px 0 18px;

            letter-spacing:
                -1px;
        }


        /* =====================================================
           DESCRIPTION
        ===================================================== */

        .resume-description {

            font-size: 16px;

            line-height: 1.8;

            color:
                rgba(255, 255, 255, 0.70);

            margin-bottom: 32px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            margin-bottom: 21px;
        }


        .form-group label {

            display: block;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 9px;

            color:
                rgba(255, 255, 255, 0.90);
        }


        /* =====================================================
           INPUTS
        ===================================================== */

        .form-group input {

            width: 100%;

            height: 55px;

            padding:
                0 17px;

            border-radius: 14px;

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            outline: none;

            background:
                rgba(0, 0, 0, 0.25);

            color: #ffffff;

            font-size: 16px;

            transition:
                all 0.3s ease;
        }


        .form-group input::placeholder {

            color:
                rgba(255, 255, 255, 0.40);
        }


        .form-group input:hover {

            border-color:
                rgba(255, 255, 255, 0.30);
        }


        .form-group input:focus {

            border-color:
                rgba(255, 255, 255, 0.65);

            background:
                rgba(0, 0, 0, 0.35);

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.20);
        }


        /* =====================================================
           SUBMIT BUTTON
        ===================================================== */

        .resume-submit-btn {

            width: 100%;

            height: 56px;

            border: none;

            border-radius: 15px;

            background:
                #ffffff;

            color:
                #020617;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;

            transition:
                all 0.3s ease;
        }


        .resume-submit-btn:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 15px 35px
                rgba(0, 0, 0, 0.35);
        }


        .resume-submit-btn:active {

            transform:
                translateY(0);
        }


        .resume-submit-btn:disabled {

            opacity: 0.55;

            cursor:
                not-allowed;

            transform:
                none;

            box-shadow:
                none;
        }


        /* =====================================================
           STATUS MESSAGE
        ===================================================== */

        .resume-status {

            width: 100%;

            min-height: 25px;

            margin-top: 18px;

            text-align: center;

            font-size: 14px;

            line-height: 1.6;

            color:
                rgba(255, 255, 255, 0.85);
        }


        /* =====================================================
           SECURITY NOTE
        ===================================================== */

        .resume-note {

            margin-top: 24px;

            padding-top: 20px;

            border-top:
                1px solid
                rgba(255, 255, 255, 0.08);

            font-size: 12px;

            line-height: 1.7;

            text-align: center;

            color:
                rgba(255, 255, 255, 0.45);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .resume-request-section {

                padding:
                    30px 15px;
            }


            .resume-card {

                padding:
                    30px 22px;

                border-radius:
                    22px;
            }


            .resume-icon {

                width: 65px;

                height: 65px;

                font-size: 30px;
            }


            .resume-card h1 {

                font-size:
                    35px;
            }


            .resume-description {

                font-size:
                    15px;
            }

        }


        /* =====================================================
           VERY SMALL SCREENS
        ===================================================== */

        @media (max-width: 380px) {

            .resume-card {

                padding:
                    25px 18px;
            }


            .resume-card h1 {

                font-size:
                    31px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     RESUME REQUEST SECTION
========================================================= -->

<section
    id="resume-request"
    class="resume-request-section">


    <div class="resume-card">


        <!-- ICON -->

        <div class="resume-icon">
            📄
        </div>


        <!-- LABEL -->

        <span class="resume-label">
            PRIVATE RESUME ACCESS
        </span>


        <!-- TITLE -->

        <h1>
            Request My Resume
        </h1>


        <!-- DESCRIPTION -->

        <p class="resume-description">

            Want to know more about my skills,
            projects and cybersecurity journey?

            Submit your details below and I will
            review your request.

        </p>


        <!-- =====================================================
             FORM
        ===================================================== -->

        <form
            id="resumeRequestForm"
            autocomplete="on">


            <!-- NAME -->

            <div class="form-group">

                <label
                    for="resumeName">

                    Your Name

                </label>


                <input
                    type="text"
                    id="resumeName"
                    name="name"
                    placeholder="Enter your name"
                    maxlength="100"
                    autocomplete="name"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label
                    for="resumeEmail">

                    Email Address

                </label>


                <input
                    type="email"
                    id="resumeEmail"
                    name="email"
                    placeholder="Enter your email"
                    maxlength="150"
                    autocomplete="email"
                    required>

            </div>


            <!-- PLACE -->

            <div class="form-group">

                <label
                    for="resumePlace">

                    Place

                </label>


                <input
                    type="text"
                    id="resumePlace"
                    name="place"
                    placeholder="City / Country"
                    maxlength="100"
                    autocomplete="address-level2"
                    required>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                id="resumeSubmitButton"
                class="resume-submit-btn">

                Request Resume

            </button>


            <!-- STATUS -->

            <div
                id="resumeStatus"
                class="resume-status"
                aria-live="polite">

            </div>


        </form>


        <!-- SECURITY NOTE -->

        <div class="resume-note">

            🔐 Your information is used only
            to process this resume request.

        </div>


    </div>

</section>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>


/*
============================================================
GOOGLE APPS SCRIPT WEB APP

THIS IS THE ONLY URL USED BY THIS HTML.

OLD URLs HAVE BEEN REMOVED.
============================================================
*/

const RESUME_API =
"https://script.google.com/macros/s/AKfycbzm3NvMfR5Akapuowm_tuV-it3QJ7mLTxiTzDdWL453RLnLlB1k0ulPGPXZPoljWE489Q/exec";



/*
============================================================
GET HTML ELEMENTS
============================================================
*/

const resumeForm =
    document.getElementById(
        "resumeRequestForm"
    );


const resumeStatus =
    document.getElementById(
        "resumeStatus"
    );


const submitButton =
    document.getElementById(
        "resumeSubmitButton"
    );


const nameInput =
    document.getElementById(
        "resumeName"
    );


const emailInput =
    document.getElementById(
        "resumeEmail"
    );


const placeInput =
    document.getElementById(
        "resumePlace"
    );



/*
============================================================
FORM SUBMISSION
============================================================
*/

resumeForm.addEventListener(
    "submit",
    async function(event) {


        /*
        Prevent normal page reload
        */

        event.preventDefault();



        /*
        ====================================================
        GET VALUES
        ====================================================
        */

        const name =
            nameInput.value.trim();


        const email =
            emailInput.value.trim();


        const place =
            placeInput.value.trim();



        /*
        ====================================================
        VALIDATION
        ====================================================
        */

        if (
            !name ||
            !email ||
            !place
        ) {

            resumeStatus.textContent =
                "Please complete all fields.";

            return;
        }



        /*
        ====================================================
        EMAIL VALIDATION
        ====================================================
        */

        const emailRegex =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (
            !emailRegex.test(email)
        ) {

            resumeStatus.textContent =
                "Please enter a valid email address.";

            return;
        }



        /*
        ====================================================
        DISABLE BUTTON
        ====================================================
        */

        submitButton.disabled = true;


        submitButton.textContent =
            "Submitting...";


        resumeStatus.textContent =
            "Sending your request...";



        /*
        ====================================================
        DATA SENT TO GOOGLE APPS SCRIPT
        ====================================================
        */

        const requestData = {

            name: name,

            email: email,

            place: place

        };



        /*
        ====================================================
        SEND REQUEST
        ====================================================
        */

        try {


            await fetch(
                RESUME_API,
                {

                    method: "POST",

                    /*
                    Google Apps Script Web Apps commonly
                    require no-cors for browser POST requests.
                    */

                    mode: "no-cors",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify(
                            requestData
                        )

                }
            );



            /*
            =================================================
            SUCCESS MESSAGE
            =================================================
            */

            resumeStatus.textContent =
                "✓ Request submitted successfully. " +
                "Please check your email for confirmation.";



            /*
            =================================================
            CLEAR FORM
            =================================================
            */

            resumeForm.reset();

        }


        catch (error) {


            /*
            =================================================
            ERROR
            =================================================
            */

            console.error(
                "Resume request error:",
                error
            );


            resumeStatus.textContent =
                "❌ Unable to submit your request. " +
                "Please try again later.";

        }


        finally {


            /*
            =================================================
            ENABLE BUTTON
            =================================================
            */

            submitButton.disabled =
                false;


            submitButton.textContent =
                "Request Resume";

        }

    }

);

</script>


</body>

</html>
