<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Request My Resume</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #172554 0%,
                    #020617 70%
                );

            color: #ffffff;
        }

        .resume-request-section {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 60px 20px;
        }

        .resume-card {

            width: 100%;

            max-width: 620px;

            padding: 45px;

            border-radius: 30px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid
                rgba(255,255,255,0.15);

            box-shadow:
                0 25px 80px
                rgba(0,0,0,0.45);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            animation:
                resumeFloat 5s
                ease-in-out
                infinite;
        }

        @keyframes resumeFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .resume-icon {

            width: 70px;
            height: 70px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 32px;

            background:
                rgba(255,255,255,0.08);

            margin-bottom: 22px;
        }

        .resume-label {

            font-size: 12px;

            letter-spacing: 3px;

            font-weight: 700;

            opacity: 0.65;
        }

        .resume-card h1 {

            font-size:
                clamp(32px, 5vw, 48px);

            margin:
                12px 0 15px;
        }

        .resume-description {

            line-height: 1.8;

            opacity: 0.72;

            margin-bottom: 30px;
        }

        .form-group {

            margin-bottom: 20px;
        }

        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: 600;
        }

        .form-group input {

            width: 100%;

            padding: 16px 18px;

            border-radius: 14px;

            border:
                1px solid
                rgba(255,255,255,0.15);

            background:
                rgba(0,0,0,0.25);

            color: #ffffff;

            outline: none;

            font-size: 16px;

            transition: 0.3s ease;
        }

        .form-group input::placeholder {

            color:
                rgba(255,255,255,0.45);
        }

        .form-group input:focus {

            border-color:
                rgba(255,255,255,0.65);

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.25);
        }

        .resume-submit-btn {

            width: 100%;

            padding: 17px;

            border: none;

            border-radius: 15px;

            cursor: pointer;

            font-size: 16px;

            font-weight: 700;

            background: #ffffff;

            color: #020617;

            transition: 0.3s ease;
        }

        .resume-submit-btn:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 15px 35px
                rgba(0,0,0,0.35);
        }

        .resume-submit-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        .resume-status {

            margin-top: 18px;

            min-height: 25px;

            line-height: 1.6;

            font-size: 14px;

            text-align: center;
        }

        .resume-note {

            margin-top: 22px;

            font-size: 12px;

            opacity: 0.55;

            line-height: 1.6;

            text-align: center;
        }

        @media (max-width: 600px) {

            .resume-card {

                padding: 30px 22px;

                border-radius: 22px;
            }
        }

    </style>

</head>


<body>


<section
    id="resume-request"
    class="resume-request-section">


    <div class="resume-card">


        <div class="resume-icon">
            📄
        </div>


        <span class="resume-label">
            PRIVATE RESUME ACCESS
        </span>


        <h1>
            Request My Resume
        </h1>


        <p class="resume-description">

            Want to know more about my skills,
            projects and cybersecurity journey?

            Submit your details below and I will
            review your request.

        </p>


        <form id="resumeRequestForm">


            <div class="form-group">

                <label for="resumeName">
                    Your Name
                </label>

                <input
                    type="text"
                    id="resumeName"
                    name="name"
                    placeholder="Enter your name"
                    maxlength="100"
                    autocomplete="name"
                    required>

            </div>


            <div class="form-group">

                <label for="resumeEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="resumeEmail"
                    name="email"
                    placeholder="Enter your email"
                    maxlength="150"
                    autocomplete="email"
                    required>

            </div>


            <div class="form-group">

                <label for="resumePlace">
                    Place
                </label>

                <input
                    type="text"
                    id="resumePlace"
                    name="place"
                    placeholder="City / Country"
                    maxlength="100"
                    autocomplete="address-level2"
                    required>

            </div>


            <button
                type="submit"
                id="resumeSubmitButton"
                class="resume-submit-btn">

                Request Resume

            </button>


            <div
                id="resumeStatus"
                class="resume-status"
                aria-live="polite">
            </div>


        </form>


        <div class="resume-note">

            🔐 Your information is used only
            to process this resume request.

        </div>


    </div>


</section>



<script>


/*
====================================================
ONLY GOOGLE APPS SCRIPT URL
====================================================
*/

const RESUME_API =
"https://script.google.com/macros/s/AKfycbzm3NvMfR5Akapuowm_tuV-it3QJ7mLTxiTzDdWL453RLnLlB1k0ulPGPXZPoljWE489Q/exec";



const resumeForm =
document.getElementById(
    "resumeRequestForm"
);


const resumeStatus =
document.getElementById(
    "resumeStatus"
);


const submitButton =
document.getElementById(
    "resumeSubmitButton"
);



resumeForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document
                .getElementById("resumeName")
                .value
                .trim();


        const email =
            document
                .getElementById("resumeEmail")
                .value
                .trim();


        const place =
            document
                .getElementById("resumePlace")
                .value
                .trim();



        /*
        ============================================
        VALIDATION
        ============================================
        */

        if (!name || !email || !place) {

            resumeStatus.textContent =
                "Please complete all fields.";

            return;
        }


        const emailRegex =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (!emailRegex.test(email)) {

            resumeStatus.textContent =
                "Please enter a valid email address.";

            return;
        }



        /*
        ============================================
        DISABLE BUTTON
        ============================================
        */

        submitButton.disabled = true;

        submitButton.textContent =
            "Submitting...";

        resumeStatus.textContent =
            "Sending your request...";



        /*
        ============================================
        DATA
        ============================================
        */

        const requestData = {

            name: name,

            email: email,

            place: place

        };



        try {


            /*
            ========================================
            SEND TO GOOGLE APPS SCRIPT
            ========================================
            */

            await fetch(

                RESUME_API,

                {

                    method: "POST",

                    mode: "no-cors",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify(
                            requestData
                        )

                }

            );


            /*
            ========================================
            SUCCESS
            ========================================
            */

            resumeStatus.textContent =
                "✓ Request submitted successfully. " +
                "Please check your email for confirmation.";


            resumeForm.reset();


        }

        catch (error) {

            console.error(
                "Resume request error:",
                error
            );


            resumeStatus.textContent =
                "❌ Unable to submit the request. " +
                "Please try again later.";

        }


        finally {

            submitButton.disabled =
                false;

            submitButton.textContent =
                "Request Resume";

        }

    }

);

</script>


</body>

</html>
